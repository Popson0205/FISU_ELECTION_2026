<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISU Admin</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body class="pg">
<header class="hero" style="padding-bottom:50px"><img src="logo.png" alt="" style="width:80px"><h1>Admin portal</h1></header>
<main class="wrap" style="max-width:960px">
<section class="card" id="login" style="max-width:380px;margin:0 auto"><h2>Sign in</h2><label>Password<input type="password" id="pw"></label><br><button class="btn" id="in">Sign in</button><p class="err" id="e"></p></section>
<section class="card" id="app" hidden>
<div class="tabs"><button id="tA" class="on">Applicants</button><button id="tV">Voters</button><button id="tE">Voting</button></div>
<div id="lst"><h2><span id="count"></span></h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="q" placeholder="Search name, ID, phone…" style="flex:1;min-width:160px;margin:0"><select id="sf" style="width:auto;margin:0"></select>
<span id="atools" hidden style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="acsv">Download list (CSV)</button><button class="btn sm alt" id="apdf">Download PDF</button><button class="btn sm" id="ajpg" style="background:#555">Download JPEGs (ZIP)</button></span>
<span id="vtools" hidden style="display:flex;gap:8px"><button class="btn sm" id="csv">Download list (CSV)</button><button class="btn sm alt" id="prt">Print list</button></span></div>
<div style="overflow-x:auto"><table><thead id="th"></thead><tbody id="rows"></tbody></table></div></div><div id="vsec" hidden></div></section></main><footer class="site-foot"><div class="pw"><span>Powered by</span><img src="geoestate.png" alt="GeoEstate Spatial Intelligence"><b>GeoEstate NIG Limited</b></div></footer>
<div class="modal" id="m"><div class="tools"><button class="btn sm" id="dl">Download image</button><button class="btn sm alt" id="sh">Share image</button>
<button class="btn sm" style="background:#555" id="x">Close</button></div>
<div class="profile" id="card"></div><p class="docs" id="docs" style="text-align:center;margin-top:12px"></p>
<div class="card" style="max-width:460px;margin:14px auto 0"><h2 style="font-size:1.05rem">Review decision</h2>
<label>Decision<select id="st"></select></label>
<div id="mail" hidden><br><label>Email subject<input id="sub"></label><br><label>Message to the person<textarea id="msg" rows="10"></textarea></label></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" id="sv">Save</button><button class="btn sm alt" id="sn" hidden>Save without email</button></div>
<p id="dmsg" role="status" style="font-weight:600;color:var(--brown)"></p></div></div>
<script>
let all=[],cur,T='app';const $=id=>document.getElementById(id);
const esc=s=>String(s||'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K={app:{list:'/api/admin/list',file:'/api/admin/file/',st:'/api/admin/status/',ok:'Qualified',sts:['Pending','Qualified','Disqualified'],h:['Ref','Name','Position','Status','Date'],c:a=>[a.ref,a.data.fullName,a.data.position]},
 vot:{list:'/api/admin/voters',file:'/api/admin/voter-file/',st:'/api/admin/voter-status/',ok:'Verified',sts:['Pending','Verified','Disqualified'],h:['Voter ID','Name','Category','Status','Date'],c:a=>[a.ref,a.data.fullName,a.data.category]}};
async function load(){const r=await fetch(K[T].list);if(!r.ok)return;all=await r.json();$('login').hidden=true;$('app').hidden=false;$('vtools').hidden=T!=='vot';$('atools').hidden=T!=='app';
 $('sf').innerHTML='<option value="">All statuses</option>'+K[T].sts.map(x=>`<option>${x}</option>`).join('');
 $('th').innerHTML='<tr>'+K[T].h.map(h=>`<th>${h}</th>`).join('')+'</tr>';draw()}
const list=()=>{const t=$('q').value.toLowerCase(),f=$('sf').value;return all.filter(a=>(!f||a.status===f)&&(a.ref+JSON.stringify(a.data)).toLowerCase().includes(t))};
const sorted=()=>list().sort((a,b)=>a.data.fullName.localeCompare(b.data.fullName));
function draw(){const l=list();$('count').textContent=`${l.length} ${T=='app'?'applicant':'voter'}${l.length==1?'':'s'}`;
 $('rows').innerHTML=l.map(a=>`<tr class="row" data-id="${a.id}">${K[T].c(a).map(x=>`<td>${esc(x)}</td>`).join('')}<td><span class="tag ${a.status}">${a.status}</span></td><td>${new Date(a.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan=5>Nothing here yet.</td></tr>'}
$('q').oninput=draw;$('sf').onchange=draw;$('rows').onclick=e=>{const tr=e.target.closest('tr.row');if(tr)view(+tr.dataset.id)};
const tab=t=>{T=t;const m={A:'app',V:'vot',E:'vote'};for(const x in m)$('t'+x).classList.toggle('on',m[x]==t);
 const e=t=='vote';$('lst').hidden=e;$('vsec').hidden=!e;$('q').value='';e?loadVote():load()};$('tE').onclick=()=>tab('vote');
$('tA').onclick=()=>tab('app');$('tV').onclick=()=>tab('vot');
$('in').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});r.ok?load():$('e').textContent='Wrong password.'};
const badge=()=>{$('qb').hidden=cur.status!==K[T].ok;$('qb').textContent='✔ '+K[T].ok};
function cardHtml(c,t){const d=c.data,k=K[t],app=t=='app',F=k.file+c.id+'/',row=(a,v)=>v?`<dt>${a}</dt><dd>${esc(v)}</dd>`:'';
 return `<div class="top"><img src="logo.png"><div><b>${app?'FISU Election Form Applicant':'FISU Registered Voter'}</b><span>${app?'Ref':'Voter ID'}: ${c.ref}</span></div></div><div class="qbadge" id="qb" ${c.status===k.ok?'':'hidden'}>✔ ${k.ok}</div>
 <div class="id"><img class="ph" src="${F}passport"><div><h3>${esc(d.fullName)}</h3><div class="pos">${app?'Position applying for:':'Category:'}<b>${esc(app?d.position:d.category)}</b></div></div></div>
 <dl>${row('Gender',d.gender)}${row('Date of birth',d.dob)}${row('Phone',d.phone)}${row('Email',d.email)}${row('LGA',d.lga+(d.ward?' / '+d.ward:''))}${row('Address',d.address)}${app?row('Institution',d.institution)+row('Department',d.department+(d.faculty?' ('+d.faculty+')':''))+row('Qualification',d.qualification)+row('Level',d.level)+row('Matric no.',d.matricNo)+row('Form fee',d.fee&&'₦'+Number(d.fee).toLocaleString('en-NG')):row('Residency',d.residency+(d.years?` (${d.years} yrs in town)`:''))+row('Referee',d.refName&&d.refName+' ('+d.refPhone+')')+row(d.school?'School':'Institution',d.school||d.institution)+row('Course',d.course)}</dl><div class="ft">Knowledge is Power · FISU-NHQ</div>`}
function view(id){cur=all.find(a=>a.id==id);const d=cur.data,k=K[T],app=T=='app',F=k.file+id+'/';
 $('card').innerHTML=cardHtml(cur,T);
 $('docs').innerHTML=(app?['admission','lgaProof','receipt']:['lgaProof','receipt',...(d.category!=='SSS 3 student'?['admission']:[])]).map(x=>`<a target="_blank" href="${F}${x}">${{admission:'Admission',lgaProof:'LGA proof',receipt:'Receipt'}[x]}</a>`).join('');
 $('st').innerHTML=k.sts.map(x=>`<option>${x}</option>`).join('');$('st').value=cur.status;badge();$('mail').hidden=true;$('sn').hidden=true;$('sv').textContent='Save';$('dmsg').textContent='';$('m').classList.add('on')}
$('x').onclick=()=>$('m').classList.remove('on');
const tpl=v=>{const d=cur.data,n=d.fullName,ok=v===K[T].ok,foot="\n\nFISU Electoral Committee\nFederation of Ido-Osun Students' Union",why='Reason:\n[Type the reason here]\n\nIf you believe this is a mistake, please reply to this email or contact the electoral committee.';
 if(T=='app')return ok?['FISUEC 2026: You are qualified',`Dear ${n},\n\nAfter reviewing your application (${cur.ref}) for the position of ${d.position}, we are pleased to inform you that you have been declared QUALIFIED to contest in the FISUEC 2026 election.\n\nCongratulations and best wishes.${foot}`]:['FISUEC 2026: Application outcome',`Dear ${n},\n\nAfter reviewing your application (${cur.ref}) for the position of ${d.position}, we regret to inform you that you have been DISQUALIFIED.\n\n${why}${foot}`];
 return ok?['FISUEC 2026: Voter registration approved',`Dear ${n},\n\nYour voter registration (Voter ID: ${cur.ref}) has been reviewed and you are ELIGIBLE to vote in the FISUEC 2026 election. Please keep your Voter ID for accreditation on election day.${d.category==='SSS 3 student'?'\n\nAs an SSS 3 student, remember to bring your promotion report sheet to the venue.':''}${foot}`]:['FISUEC 2026: Voter registration outcome',`Dear ${n},\n\nAfter reviewing your voter registration (Voter ID: ${cur.ref}), we regret to inform you that you are NOT ELIGIBLE to vote.\n\n${why}${foot}`]};
$('st').onchange=()=>{const v=$('st').value,mail=v===K[T].ok||v==='Disqualified';
 $('mail').hidden=!mail;$('sn').hidden=!mail;$('sv').textContent=mail?'Save & send email':'Save';$('dmsg').textContent='';
 if(mail){const t=tpl(v);$('sub').value=t[0];$('msg').value=t[1]}};
async function save(send){const v=$('st').value,msg=$('msg').value;
 if(send){if(!$('sub').value.trim()||!msg.trim())return $('dmsg').textContent='Subject and message are required.';
  if(msg.includes('[Type the reason here]'))return $('dmsg').textContent='Replace [Type the reason here] with the actual reason first.'}
 $('sv').disabled=$('sn').disabled=true;$('dmsg').textContent='Saving…';
 try{const r=await fetch('/api/admin/decide/'+T+'/'+cur.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v,send,subject:$('sub').value,body:msg})});const d=await r.json();
  if(!r.ok)throw new Error(d.error);cur.status=v;badge();draw();
  $('dmsg').textContent=!send?'Saved.':d.mail.sent?'Saved. Email sent to '+cur.data.email+'.':'Saved, but the email was NOT sent: '+d.mail.error}
 catch(e){$('dmsg').textContent=e.message}
 $('sv').disabled=$('sn').disabled=false}
$('sv').onclick=()=>save(!$('mail').hidden);$('sn').onclick=()=>save(false);
const snap=async()=>{const c=await html2canvas($('card'),{scale:2,useCORS:true,backgroundColor:null});return new Promise(r=>c.toBlob(r,'image/png'))};
$('dl').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await snap());a.download=cur.ref+'.png';a.click()};
$('sh').onclick=async()=>{const f=new File([await snap()],cur.ref+'.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:cur.data.fullName}).catch(()=>{});else $('dl').click()};
$('csv').onclick=()=>{const H=['No','Voter ID','Full name','Gender','Date of birth','Phone','Email','Address','LGA of origin','Ward','Residency','Years in town','Referee','Referee phone','Category','School / Institution','Course','Status','Registered'];
 const R=sorted().map((a,i)=>{const d=a.data;return[i+1,a.ref,d.fullName,d.gender,d.dob,'="'+d.phone+'"',d.email,d.address,d.lga,d.ward,d.residency,d.years,d.refName,d.refPhone?'="'+d.refPhone+'"':'',d.category,d.school||d.institution,d.course,a.status,new Date(a.created_at).toLocaleDateString()]});
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[H,...R].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='FISU-voters.csv';a.click()};
$('prt').onclick=()=>{const l=sorted(),w=window.open('','_blank');
 w.document.write(`<title>FISU Voters List</title><style>body{font:13px sans-serif}table{width:100%;border-collapse:collapse}td,th{border:1px solid #444;padding:4px 6px;text-align:left}img{width:46px;height:56px;object-fit:cover}tr{page-break-inside:avoid}</style><h2>FISU Voters Accreditation List (${l.length})</h2><table><tr><th>No</th><th>Photo</th><th>Name</th><th>Voter ID</th><th>Phone</th><th>Category</th><th>Signature</th></tr>${l.map((a,i)=>`<tr><td>${i+1}</td><td><img src="/api/admin/voter-file/${a.id}/passport"></td><td>${esc(a.data.fullName)}</td><td>${a.ref}</td><td>${esc(a.data.phone)}</td><td>${esc(a.data.category)}</td><td style="width:110px"></td></tr>`).join('')}</table>`);
 w.document.close();setTimeout(()=>w.print(),1500+l.length*40)};
let V;
const vp=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Failed');return d});
const vAct=async(u,b,ask)=>{if(ask&&!confirm(ask))return;try{await vp(u,b)}catch(e){alert(e.message)}loadVote()};
async function loadVote(){const r=await fetch('/api/admin/vote');if(!r.ok)return;V=await r.json();renderVote()}
function renderVote(){const v=V,n=v.positions.length,st={pending:'Voting has not started',open:'Voting is OPEN',closed:'Voting has ENDED'}[v.state];
 const shown=v.reveal<0?'Voting-ended message (no results yet)':v.reveal>=n?'Complete winners dashboard':`Position ${v.reveal+1} of ${n}: ${v.positions[v.reveal].position}`;
 const B=(id,t,x='')=>`<button class="btn sm" id="${id}" ${x}>${t}</button>`;
 $('vsec').innerHTML=`<h2>${st}</h2><p>Turnout: <b id="tn">${v.voted} of ${v.eligible}</b> verified voters. <a href="/screen" target="_blank">Open big screen ↗</a></p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${v.state=='pending'?B('vs','Start voting'):''}${v.state=='open'?B('ve','End voting','style="background:#a02018"'):''}${v.state=='closed'?B('rp','◀ Previous')+B('rn','Show next position ▶')+B('ra','Show all winners','class="btn sm alt"')+B('rh','Hide results','style="background:#555"')+(v.reveal<0?B('ro','Reopen voting','style="background:#555"'):''):''}</div>
 ${v.state=='closed'?`<p>Big screen is showing: <b>${esc(shown)}</b></p>`:''}
 <h3>Candidates${v.state=='pending'?' <small>(applicants marked Qualified; locked when voting starts)</small>':''}</h3>
 ${v.positions.map(p=>`<p><b>${esc(p.position)}</b>: ${p.names.map(esc).join(', ')}</p>`).join('')||'<p>No applicants are marked Qualified yet.</p>'}
 ${v.results?'<h3>Results (admin only)</h3>'+v.results.map(r=>`<p><b>${esc(r.position)}</b> · total ${r.total}${r.tie?' · TIE':''}<br>${r.candidates.map(c=>`${esc(c.name)}: <b>${c.votes}</b>${c.winner?' ★':''}`).join(' · ')}</p>`).join(''):''}
 <h3>Voting devices</h3><p><small>Only paired devices can open <b>/vote</b>. Generate a code, open /vote on the laptop, tablet or phone and enter it.</small></p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="dn" placeholder="Device name (e.g. Booth 1)" style="flex:1;min-width:160px;margin:0">${B('dp','Generate pairing code')}</div>
 <p id="pcode" style="font:700 2rem Fraunces,serif;color:var(--brown);margin:8px 0"></p>
 <table>${v.devices.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.revoked?'Revoked':d.last_seen?'Last seen '+new Date(d.last_seen).toLocaleTimeString():'Not used yet'}</td><td>${d.revoked?'':`<button class="btn sm" style="background:#a02018" data-rv="${d.id}">Revoke</button>`}</td></tr>`).join('')||'<tr><td>No devices yet.</td></tr>'}</table>
 <p style="margin-top:18px">${B('rs','Reset election (test runs only)','style="background:#555"')}</p>`;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f},R=a=>()=>vAct('/api/admin/vote/reveal',{action:a});
 on('vs',()=>vAct('/api/admin/vote/start',0,'Start voting now? The candidate list will be locked.'));
 on('ve',()=>vAct('/api/admin/vote/end',0,'End voting? Voters will no longer be able to vote.'));
 on('ro',()=>vAct('/api/admin/vote/reopen',0,'Reopen voting?'));on('rn',R('next'));on('rp',R('prev'));on('ra',R('all'));on('rh',R('hide'));
 on('dp',async()=>{try{const d=await vp('/api/admin/vote/pair',{name:$('dn').value});$('pcode').textContent=d.code+'  (valid 15 minutes)'}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>vAct('/api/admin/vote/revoke/'+b.dataset.rv,0,'Revoke this device?'));
 on('rs',()=>{const t=prompt('This deletes ALL votes and resets the election. Type RESET to confirm.');if(t)vAct('/api/admin/vote/reset',{confirm:t})})}
setInterval(async()=>{if(T!=='vote'||!V||V.state!=='open')return;const r=await fetch('/api/admin/vote');if(r.ok){const d=await r.json();V.voted=d.voted;if($('tn'))$('tn').textContent=d.voted+' of '+d.eligible}},5000);
let ORD=[];fetch('/api/config').then(r=>r.json()).then(c=>ORD=c.positions||[]).catch(()=>{});
const oi=p=>{const i=ORD.indexOf(p);return i<0?99:i},csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"',fmt=n=>n?'₦'+Number(n).toLocaleString('en-NG'):'';
const sortedApp=()=>list().sort((a,b)=>oi(a.data.position)-oi(b.data.position)||a.data.fullName.localeCompare(b.data.fullName));
const saveBlob=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
const snapHtml=async(html,scale)=>{const el=document.createElement('div');el.style.cssText='position:fixed;left:-10000px;top:0';el.innerHTML=html;document.body.appendChild(el);
 await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)));
 try{return await html2canvas(el.firstElementChild,{scale,backgroundColor:'#ffffff',useCORS:true})}finally{el.remove()}};
const busy=async(b,fn)=>{const t=b.textContent;b.disabled=true;try{await fn(x=>b.textContent=x)}catch(e){alert('Could not create the file: '+e.message)}b.disabled=false;b.textContent=t};
$('acsv').onclick=()=>{const l=sortedApp();if(!l.length)return alert('No applicants to export.');
 const H=['No','Reference','Full name','Gender','Date of birth','Phone','Email','Address','LGA of origin','Ward','Position','Form fee (NGN)','Institution','Faculty','Department','Qualification','Level','Matric no.','Status','Applied'];
 const R=l.map((a,i)=>{const d=a.data;return[i+1,a.ref,d.fullName,d.gender,d.dob,'="'+d.phone+'"',d.email,d.address,d.lga,d.ward,d.position,d.fee,d.institution,d.faculty,d.department,d.qualification,d.level,d.matricNo,a.status,new Date(a.created_at).toLocaleDateString()]});
 saveBlob(new Blob(['\ufeff'+[H,...R].map(r=>r.map(csvq).join(',')).join('\r\n')],{type:'text/csv'}),'FISU-applicants.csv')};
const PGW=1123,PGH=794,PER=7;
const pageHtml=(rows,p,np,start,total,note)=>`<div style="width:${PGW}px;height:${PGH}px;box-sizing:border-box;padding:20px 26px;background:#fff;font-family:'Hanken Grotesk',Arial,sans-serif;color:#2a1a10;position:relative">
<div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #e8851e;padding-bottom:8px"><img src="logo.png" style="width:52px;height:52px;object-fit:contain"><div style="flex:1"><div style="font:700 19px Georgia,serif;color:#4a2410">FISU Election 2026 — Applicants</div><div style="font-size:12px;color:#7a3e14">${esc(note)} · ${total} applicant${total==1?'':'s'} · ${new Date().toLocaleDateString('en-GB')}</div></div><div style="font-size:12px">Page ${p+1} of ${np}</div></div>
<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;word-break:break-word"><tr style="background:#4a2410;color:#fff;text-align:left"><th style="padding:5px">No</th><th>Photo</th><th>Applicant</th><th>Position</th><th>Contact</th><th>LGA</th><th>Education</th><th>Fee</th><th>Status</th></tr>
${rows.map((a,i)=>{const d=a.data;return `<tr style="border-bottom:1px solid #eadfce;height:78px"><td style="padding:4px">${start+i+1}</td><td><img src="/api/admin/file/${a.id}/passport" style="width:46px;height:58px;object-fit:cover;border:2px solid #e8851e"></td><td><b>${esc(d.fullName)}</b><br>${a.ref}<br>${esc(d.gender)} · ${esc(d.dob)}</td><td><b>${esc(d.position)}</b></td><td>${esc(d.phone)}<br>${esc(d.email)}</td><td>${esc(d.lga)}${d.ward?'<br>'+esc(d.ward):''}</td><td>${esc(d.institution)}<br>${esc(d.department)}<br>${esc(d.qualification)} · ${esc(d.level)}</td><td>${esc(fmt(d.fee))}</td><td><b>${a.status}</b></td></tr>`}).join('')}</table>
<div style="position:absolute;left:26px;right:26px;bottom:10px;font-size:10.5px;color:#8a7662;display:flex;justify-content:space-between"><span>Federation of Ido-Osun Students' Union · FISUEC 2026</span><span>Powered by GeoEstate NIG Limited</span></div></div>`;
$('apdf').onclick=()=>busy($('apdf'),async set=>{const l=sortedApp();if(!l.length)throw new Error('No applicants to export.');
 const{jsPDF}=window.jspdf,pdf=new jsPDF('l','mm','a4'),np=Math.ceil(l.length/PER),note=[$('sf').value||'All statuses',$('q').value&&'search: '+$('q').value].filter(Boolean).join(', ');
 for(let p=0;p<np;p++){set(`Preparing ${p+1}/${np}…`);const c=await snapHtml(pageHtml(l.slice(p*PER,(p+1)*PER),p,np,p*PER,l.length,note),1.5);if(p)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,297,210)}
 pdf.save('FISU-applicants.pdf')});
$('ajpg').onclick=()=>busy($('ajpg'),async set=>{const l=sortedApp();if(!l.length)throw new Error('No applicants to export.');const Z=new JSZip();
 for(let i=0;i<l.length;i++){set(`Preparing ${i+1}/${l.length}…`);const a=l[i];
  const c=await snapHtml(`<div class="profile">${cardHtml(a,'app').replace(' id="qb"','')}</div>`,2);
  Z.file(`${String(i+1).padStart(2,'0')}-${a.ref}-${a.data.fullName.replace(/[^\w]+/g,'_')}.jpg`,await new Promise(r=>c.toBlob(r,'image/jpeg',.92)))}
 set('Zipping…');saveBlob(await Z.generateAsync({type:'blob'}),'FISU-applicant-profiles.zip')});
load();
</script></body></html>
