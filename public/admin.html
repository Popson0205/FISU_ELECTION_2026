<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISU Admin</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head><body>
<header class="hero" style="padding-bottom:50px"><img src="logo.png" alt="" style="width:80px"><h1>Admin portal</h1></header>
<main class="wrap" style="max-width:960px">
<section class="card" id="login" style="max-width:380px;margin:0 auto"><h2>Sign in</h2><label>Password<input type="password" id="pw"></label><br><button class="btn" id="in">Sign in</button><p class="err" id="e"></p></section>
<section class="card" id="app" hidden><h2><span id="count">Applicants</span></h2><input id="q" placeholder="Search name, reference, position…" style="margin-bottom:12px">
<div style="overflow-x:auto"><table><thead><tr><th>Ref</th><th>Name</th><th>Position</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<div class="modal" id="m"><div class="tools"><button class="btn sm" id="dl">Download image</button><button class="btn sm alt" id="sh">Share image</button>
<select id="st" style="width:auto;margin:0"><option>Pending</option><option>Approved</option><option>Rejected</option></select><button class="btn sm" style="background:#555" id="x">Close</button></div>
<div class="profile" id="card"></div><p class="docs" id="docs" style="text-align:center;margin-top:12px"></p></div>
<script>
let all=[],cur;const $=id=>document.getElementById(id);
const esc=s=>String(s||'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await fetch('/api/admin/list');if(!r.ok)return;all=await r.json();$('login').hidden=true;$('app').hidden=false;draw()}
function draw(){const t=$('q').value.toLowerCase();const l=all.filter(a=>(a.ref+JSON.stringify(a.data)).toLowerCase().includes(t));
 $('count').textContent=`${l.length} applicant${l.length==1?'':'s'}`;
 $('rows').innerHTML=l.map(a=>`<tr class="row" data-id="${a.id}"><td>${a.ref}</td><td>${esc(a.data.fullName)}</td><td>${esc(a.data.position)}</td><td><span class="tag ${a.status}">${a.status}</span></td><td>${new Date(a.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan=5>No applications yet.</td></tr>'}
$('q').oninput=draw;$('rows').onclick=e=>{const tr=e.target.closest('tr.row');if(tr)open(+tr.dataset.id)};
$('in').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});r.ok?load():$('e').textContent='Wrong password.'};
function open(id){cur=all.find(a=>a.id==id);const d=cur.data,row=(k,v)=>`<dt>${k}</dt><dd>${esc(v)}</dd>`;
 $('card').innerHTML=`<div class="top"><img src="logo.png"><div><b>FISU Election Form Applicant</b><span>Ref: ${cur.ref}</span></div></div>
 <div class="id"><img class="ph" src="/api/admin/file/${id}/passport"><div><h3>${esc(d.fullName)}</h3><span class="pos">${esc(d.position)}</span></div></div>
 <dl>${row('Gender',d.gender)}${row('Date of birth',d.dob)}${row('Phone',d.phone)}${row('Email',d.email)}${row('LGA',d.lga+(d.ward?' / '+d.ward:''))}${row('Address',d.address)}${row('Institution',d.institution)}${row('Department',d.department+(d.faculty?' ('+d.faculty+')':''))}${row('Qualification',d.qualification)}${d.accounting?row('Accounting',d.accounting):''}${row('Level',d.level)}${row('Matric no.',d.matricNo)}${row('Payment ref',d.paymentRef)}</dl><div class="ft">Knowledge is Power · FISU-NHQ</div>`;
 $('docs').innerHTML=['admission','lgaProof','receipt'].map(k=>`<a target="_blank" href="/api/admin/file/${id}/${k}">${{admission:'Admission',lgaProof:'LGA proof',receipt:'Receipt'}[k]}</a>`).join('');
 $('st').value=cur.status;$('m').classList.add('on')}
$('x').onclick=()=>$('m').classList.remove('on');
$('st').onchange=async()=>{await fetch('/api/admin/status/'+cur.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('st').value})});cur.status=$('st').value;draw()};
const snap=async()=>{const c=await html2canvas($('card'),{scale:2,useCORS:true,backgroundColor:null});return new Promise(r=>c.toBlob(r,'image/png'))};
$('dl').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await snap());a.download=cur.ref+'.png';a.click()};
$('sh').onclick=async()=>{const f=new File([await snap()],cur.ref+'.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:cur.data.fullName}).catch(()=>{});else $('dl').click()};
load();
</script></body></html>
